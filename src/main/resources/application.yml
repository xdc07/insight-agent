server:
  port: 8080

spring:
  application:
    name: insight-agent
  datasource:
    url: jdbc:mysql://localhost:3306/data_agent?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  # DeepSeek 走 OpenAI 兼容接口：base-url 指向 DeepSeek，Key 从环境变量读，别写死
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-flash
          temperature: 0.3

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.xiaodoucheng: debug
servlet:
  multipart:
    max-file-size: 20MB
    max-request-size: 20MB
